<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">José Zenteno · Backend Developer</title>
  <desc id="d">Banner animado estilo terminal con el nombre y el stack de José Zenteno.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#002c50"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="typing">
      <rect x="60" y="150" width="0" height="50">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0087;0.0175;0.0262;0.0350;0.0437;0.0525;0.0612;0.0700;0.0788;0.0875;0.0962;0.1050;0.1137;0.1225;0.1313;0.1400;0.1487;0.1575;0.1662;0.1750;0.1837;0.1925;0.2012;0.2100;0.2188;0.2275;0.2362;0.2450;0.2537;0.2625;0.2712;0.2800;0.2887;0.2975;0.3063;0.3150;0.3237;0.3325;0.3412;0.3500;0.8500;0.8530;0.8560;0.8590;0.8620;0.8650;0.8680;0.8710;0.8740;0.8770;0.8800;0.8830;0.8860;0.8890;0.8920;0.8950;0.8980;0.9010;0.9040;0.9070;0.9100;0.9130;0.9160;0.9190;0.9220;0.9250;0.9280;0.9310;0.9340;0.9370;0.9400;0.9430;0.9460;0.9490;0.9520;0.9550;0.9580;0.9610;0.9640;0.9670;0.9700;1.0000" values="0;18;36;54;72;90;108;126;144;162;180;198;216;234;252;270;288;306;324;342;360;378;396;414;432;450;468;486;504;522;540;558;576;594;612;630;648;666;684;702;720;720;702;684;666;648;630;612;594;576;558;540;522;504;486;468;450;432;414;396;378;360;342;324;306;288;270;252;234;216;198;180;162;144;126;108;90;72;54;36;18;0;0"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: Consolas, "Cascadia Code", "SFMono-Regular", Menlo, "Courier New", monospace; }
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }

    .fade-1 { opacity: 0; animation: fade .8s ease-out .2s forwards; }
    .fade-2 { opacity: 0; animation: fade .8s ease-out .6s forwards; }
    .fade-3 { opacity: 0; animation: fade .8s ease-out 4.2s forwards; }

    .cursor    { animation: blink 1s step-end infinite; }

    .float-a { animation: float 6s ease-in-out infinite; }
    .float-b { animation: float 7s ease-in-out -2s infinite; }
    .float-c { animation: float 8s ease-in-out -4s infinite; }
    .pulse   { animation: pulse 2.4s ease-in-out infinite; }

    @keyframes fade  { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .fade-1, .fade-2, .fade-3 { animation: none; opacity: 1; }
      .cursor { animation: none; }
      .float-a, .float-b, .float-c, .pulse { animation: none; }
    }
  </style>

  <!-- Fondo -->
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="18" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>

  <!-- Barra de ventana -->
  <circle cx="34" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="28" r="6" fill="#febc2e"/>
  <circle cx="74" cy="28" r="6" fill="#28c840"/>
  <text x="100" y="33" class="mono" font-size="14" fill="#94a3b8">~/josezenteno — bash</text>

  <!-- Nombre -->
  <g class="fade-1">
    <text x="60" y="88" class="mono" font-size="20" fill="#38bdf8">$ whoami</text>
  </g>
  <g class="fade-2">
    <text x="60" y="134" class="sans" font-size="46" font-weight="700" fill="#f8fafc">José Zenteno</text>
  </g>

  <!-- Línea que se escribe sola -->
  <g clip-path="url(#typing)">
    <text x="60" y="186" class="mono" font-size="28" fill="url(#accent)"
          textLength="720" lengthAdjust="spacingAndGlyphs">Backend Developer · C# · .NET · Java</text>
  </g>
  <rect class="cursor" x="66" y="162" width="14" height="30" fill="#38bdf8">
    <animate attributeName="x" dur="9s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.0087;0.0175;0.0262;0.0350;0.0437;0.0525;0.0612;0.0700;0.0788;0.0875;0.0962;0.1050;0.1137;0.1225;0.1313;0.1400;0.1487;0.1575;0.1662;0.1750;0.1837;0.1925;0.2012;0.2100;0.2188;0.2275;0.2362;0.2450;0.2537;0.2625;0.2712;0.2800;0.2887;0.2975;0.3063;0.3150;0.3237;0.3325;0.3412;0.3500;0.8500;0.8530;0.8560;0.8590;0.8620;0.8650;0.8680;0.8710;0.8740;0.8770;0.8800;0.8830;0.8860;0.8890;0.8920;0.8950;0.8980;0.9010;0.9040;0.9070;0.9100;0.9130;0.9160;0.9190;0.9220;0.9250;0.9280;0.9310;0.9340;0.9370;0.9400;0.9430;0.9460;0.9490;0.9520;0.9550;0.9580;0.9610;0.9640;0.9670;0.9700;1.0000" values="66;84;102;120;138;156;174;192;210;228;246;264;282;300;318;336;354;372;390;408;426;444;462;480;498;516;534;552;570;588;606;624;642;660;678;696;714;732;750;768;786;786;768;750;732;714;696;678;660;642;624;606;588;570;552;534;516;498;480;462;444;426;408;390;372;354;336;318;300;282;264;246;228;210;192;174;156;138;120;102;84;66;66"/>
  </rect>

  <!-- Subtítulo -->
  <g class="fade-3">
    <circle class="pulse" cx="66" cy="229" r="5" fill="#28c840"/>
    <text x="82" y="235" class="sans" font-size="18" fill="#cbd5e1">Estudiante TUP · UTN FRGP · Buenos Aires · Buscando mi primera experiencia IT</text>
  </g>

  <!-- Decoración derecha -->
  <g class="mono" font-weight="700">
    <g class="float-a"><text x="930" y="110" font-size="64" fill="#38bdf8" fill-opacity="0.85">{ }</text></g>
    <g class="float-b"><text x="1050" y="170" font-size="44" fill="#a78bfa" fill-opacity="0.8">&lt;/&gt;</text></g>
    <g class="float-c"><text x="960" y="230" font-size="30" fill="#f8fafc" fill-opacity="0.5">SELECT *</text></g>
  </g>
</svg>
