<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t">
  <title id="t">Tienda Tecnológica 2.0 · En desarrollo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#002c50"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6db33f"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: Consolas, "Cascadia Code", Menlo, "Courier New", monospace; }
    .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .fill { animation: load 4s ease-in-out infinite; }
    .dot  { animation: blink 1.2s ease-in-out infinite; }
    .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; }
    .gear { transform-origin: 400px 150px; animation: spin 6s linear infinite; }
    @keyframes load  { 0% { width: 0; } 70%, 100% { width: 560px; } }
    @keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .fill { animation: none; width: 400px; } .dot, .gear { animation: none; opacity: 1; }
    }
  </style>

  <rect width="800" height="450" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="799" height="449" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>

  <g class="gear">
    <circle cx="400" cy="150" r="54" fill="none" stroke="#6db33f" stroke-width="18" stroke-dasharray="21.2 21.2"/>
    <circle cx="400" cy="150" r="48" fill="#6db33f"/>
    <circle cx="400" cy="150" r="18" fill="#0b1a2e"/>
  </g>

  <text x="400" y="262" text-anchor="middle" class="sans" font-size="34" font-weight="700" fill="#f8fafc">Tienda Tecnológica 2.0</text>
  <text x="400" y="298" text-anchor="middle" class="mono" font-size="18" fill="#94a3b8">Java · Spring Boot · JPA · MySQL</text>

  <rect x="120" y="335" width="560" height="12" rx="6" fill="#ffffff" fill-opacity="0.08"/>
  <rect class="fill" x="120" y="335" width="0" height="12" rx="6" fill="url(#bar)"/>

  <text x="372" y="390" text-anchor="middle" class="mono" font-size="18" fill="#cbd5e1">En desarrollo</text>
  <g fill="#cbd5e1">
    <circle class="dot"    cx="448" cy="385" r="3"/>
    <circle class="dot d2" cx="460" cy="385" r="3"/>
    <circle class="dot d3" cx="472" cy="385" r="3"/>
  </g>
</svg>
